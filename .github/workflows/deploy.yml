name: Deploy Pavilion Club to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Verify & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 1. Typecheck code integrity
        run: pnpm typecheck

      - name: 2. Build static web app
        run: pnpm --filter @pavilion/web build
        env:
          NEXT_PUBLIC_TURFOS_API_URL: ${{ secrets.NEXT_PUBLIC_TURFOS_API_URL || 'https://clubops.theeyelevelstudio.com' }}

      - name: 3. Install luxury editorial homepage & configure .htaccess
        run: |
          cp apps/web/public/index.html apps/web/out/index.html
          cat << 'EOF' > apps/web/out/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            RewriteCond %{DOCUMENT_ROOT}/$1/index.html -f
            RewriteRule ^(.*)/?$ $1/index.html [L]
            ErrorDocument 404 /404.html
          </IfModule>
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/webp "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType font/woff2 "access plus 1 year"
          </IfModule>
          EOF

      - name: 4. Pre-deploy sanity check (Validate files)
        run: |
          echo "Checking generated output files..."
          test -f apps/web/out/index.html || { echo "ERROR: Missing out/index.html"; exit 1; }
          test -f apps/web/out/book/index.html || { echo "ERROR: Missing out/book/index.html"; exit 1; }
          test -f apps/web/out/.htaccess || { echo "ERROR: Missing out/.htaccess"; exit 1; }
          grep -q "hello@thepavilionclub.com" apps/web/out/index.html || { echo "ERROR: Missing official email in index.html"; exit 1; }
          grep -q "Mogappair East" apps/web/out/index.html || { echo "ERROR: Missing Mogappair East in index.html"; exit 1; }
          echo "SUCCESS: All pre-deploy checks passed! Proceeding to Hostinger FTP deployment."

      - name: 5. Deploy to Hostinger via High-Performance LFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          node scripts/generate-lftp-script.cjs
          lftp -f deploy_lftp.txt
          echo "FTP deployment script finished successfully."

      - name: 6. Post-deploy live healthcheck
        run: |
          echo "Verifying live website response from thepavilionclub.com..."
          sleep 5
          for i in 1 2 3 4 5; do
            echo "Checking live site attempt $i..."
            HTML=$(curl -f -s "https://thepavilionclub.com/?v=$(date +%s%N)")
            if echo "$HTML" | grep -q "membership-sec"; then
              echo "SUCCESS: thepavilionclub.com is live with the in-page membership section!"
              exit 0
            fi
            sleep 4
          done
          echo "Notice: CDN / LiteSpeed cache is propagating."
