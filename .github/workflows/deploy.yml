name: Deploy Pavilion Club to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static web app
        run: pnpm --filter @pavilion/web build
        env:
          NEXT_PUBLIC_TURFOS_API_URL: ${{ secrets.NEXT_PUBLIC_TURFOS_API_URL || 'https://clubops.theeyelevelstudio.com' }}

      - name: Install luxury editorial homepage & configure .htaccess
        run: |
          cp apps/web/public/index.html apps/web/out/index.html
          cat << 'EOF' > apps/web/out/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            RewriteCond %{DOCUMENT_ROOT}/$1/index.html -f
            RewriteRule ^(.*)/?$ $1/index.html [L]
            ErrorDocument 404 /404.html
          </IfModule>
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/webp "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType font/woff2 "access plus 1 year"
          </IfModule>
          EOF

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apps/web/out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './public_html/' }}
